# Copy relevant values into your local Eclipse Run Configuration > Environment.
# This matches application.properties; do not commit your actual credentials.
spring.application.name=AIURegistration
spring.datasource.url=jdbc:mysql://localhost:3306/aiu_registration
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.thymeleaf.check-template-location=false
server.port=8082
app.student.password=${STUDENT_LOGIN_PASSWORD}
app.advisor.password=${ADVISOR_LOGIN_PASSWORD}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

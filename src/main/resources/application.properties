spring.application.name=AIURegistration


spring.datasource.url=jdbc:mysql://localhost:3306/aiu_registration
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

server.port=8082

app.student.password=${STUDENT_LOGIN_PASSWORD}
app.advisor.password=${ADVISOR_LOGIN_PASSWORD}